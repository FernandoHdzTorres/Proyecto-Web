<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Administración · Gamerbook</title>
</head>
<body>
    <header class="barra-superior">
        <div class="barra-superior__busqueda">
            <a href="perfil.html"><h1>GB</h1></a>
        </div>
        <nav class="barra-superior__nav">
            <a href="muro.html">Muro</a>
            <a href="tienda.html">Tienda</a>
            <a href="escuadrones.html">Escuadrones</a>
            <a href="perfil.html">Perfil</a>
        </nav>
        <div class="barra-superior__botones">
            <button id="boton-mensaje" type="button" aria-label="Mensajes">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="#fff" class="botonesheader-6"><path stroke-linecap="round" stroke-linejoin="round" d="M8.625 9.75a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm3.75 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm3.75 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM2.25 12.76c0 1.6 1.123 2.994 2.707 3.227 1.087.16 2.185.283 3.293.369V21l4.184-4.183a1.14 1.14 0 0 1 .778-.332 48.294 48.294 0 0 0 5.83-.498c1.585-.233 2.708-1.626 2.708-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z"/></svg>
            </button>
            <button type="button" aria-label="Notificaciones">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="#fff" class="botonesheader-6"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/></svg>
            </button>
            <button id="boton-salir" aria-label="Cerrar sesión">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="#fff" class="botonesheader-6"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/></svg>
            </button>
        </div>
    </header>

    <main class="administracion contenedor">
        <h2>Administración</h2>

        <section class="administracion__seccion">
            <h3>Cuentas con honor negativo</h3>
            <div id="lista-cuentas-negativas" class="administracion__lista"></div>
        </section>

        <section class="administracion__seccion">
            <h3>Catálogo de juegos</h3>
            <form id="form-juego" class="administracion__form" enctype="multipart/form-data">
                <input type="hidden" name="juego_id">
                <input name="nombre" type="text" maxlength="100" placeholder="Nombre del juego" required>
                <input name="imagen" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/svg+xml">
                <button type="submit">Guardar juego</button>
                <button id="limpiar-juego" type="button">Limpiar</button>
            </form>
            <div id="lista-juegos" class="administracion__catalogo"></div>
        </section>

        <section class="administracion__seccion">
            <h3>Catálogo de consolas</h3>
            <form id="form-plataforma" class="administracion__form" enctype="multipart/form-data">
                <input type="hidden" name="plataforma_id">
                <input name="nombre" type="text" maxlength="60" placeholder="Nombre de la consola" required>
                <input name="imagen" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/svg+xml">
                <button type="submit">Guardar consola</button>
                <button id="limpiar-plataforma" type="button">Limpiar</button>
            </form>
            <div id="lista-plataformas" class="administracion__catalogo"></div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
