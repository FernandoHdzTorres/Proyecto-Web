<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
    <link rel="preload" href="css/style.css" as="style">
    <link rel="stylesheet" href="css/style.css">

    <title>Gamerbook</title>
</head>
<body>
    <header class="barra-superior">
        
        <div class="barra-superior__busqueda">
            <a href="perfil.html"><h1>GB</h1></a>
            <input type="text" placeholder="buscar en gamerbook">
        </div>

        <nav class="barra-superior__nav">
            <a href="muro.html">Muro</a>
            <a href="tienda.html" class="activo">Tienda</a>
            <a href="escuadrones.html">Escuadrones</a>
            <a href="perfil.html">Perfil</a>
        </nav>

        <div class="barra-superior__botones">
            <button id="boton-mensaje">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="#fff" class="botonesheader-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 9.75a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375m-13.5 3.01c0 1.6 1.123 2.994 2.707 3.227 1.087.16 2.185.283 3.293.369V21l4.184-4.183a1.14 1.14 0 0 1 .778-.332 48.294 48.294 0 0 0 5.83-.498c1.585-.233 2.708-1.626 2.708-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />
                </svg>
            </button>
            <button>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="#fff" class="botonesheader-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
                </svg>
            </button>
            <button id="boton-salir">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="#fff" class="botonesheader-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
                </svg>
            </button>
        </div>    
    </header>

    <main class="tienda contenedor">
        <div class="tienda__intro">
            <div class="div-vender">
                <h2>GB STORE</h2>
                <button id="vender-producto" class="boton-global">Vender artículo</button>
            </div>
            <div class="tienda__principio">
                <h3>¡Encuentra productos de tus marcas favoritas!</h3>
                <div class="tienda__categorias">
                    <button>
                        <img src="img/xbox.png" alt="xbox"  height="150" width="150">
                    </button>
                    <button>
                        <img src="img/ps.png" alt="playstation"  height="150" width="150">
                    </button>
                    <button>
                        <img src="img/nintendo.png" alt="nintendo"  height="150" width="150">
                    </button>
                    <button>
                        <img src="img/pc.png" alt="pc" height="150" width="150">
                    </button>
                </div>
            </div>
        </div>
        <section class="tienda__publicar no-mostrar">
            <div class="tienda__publicar-cabecera">
                <h3 id="tienda-publicar-titulo">Vende tu artículo</h3>
                <p>Completa los datos para publicar un producto en la tienda.</p>
            </div>
            <form class="tienda__form-publicar" method="post" enctype="multipart/form-data">
                <div class="tienda__campo-publicar">
                    <label for="producto-nombre">Nombre del artículo</label>
                    <input id="producto-nombre" name="nombre" type="text" maxlength="80" placeholder="Ej. Control inalámbrico" required>
                </div>
                <div class="tienda__campo-publicar">
                    <label for="producto-precio">Precio</label>
                    <input id="producto-precio" name="precio" type="number" min="0" step="0.01" placeholder="0.00" required>
                </div>
                <div class="tienda__campo-publicar">
                    <label for="producto-plataforma">Plataforma</label>
                    <select id="producto-plataforma" name="plataforma" required>
                        <option value="" selected disabled>Selecciona una plataforma</option>
                        <option value="Xbox">Xbox</option>
                        <option value="PlayStation">PlayStation</option>
                        <option value="Nintendo">Nintendo</option>
                        <option value="PC">PC</option>
                    </select>
                </div>
                <div class="tienda__campo-publicar">
                    <label for="producto-imagen">Imagen del artículo</label>
                    <input id="producto-imagen" name="imagen" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required>
                </div>
                <div class="tienda__campo-publicar">
                    <label for="producto-cantidad">Cantidad disponible</label>
                    <input id="producto-cantidad" name="cantidad_stock" type="number" min="1" max="999" value="1" required>
                </div>
                <div class="tienda__campo-publicar tienda__campo-publicar--completo">
                    <label for="producto-descripcion">Descripción</label>
                    <textarea id="producto-descripcion" name="descripcion" rows="4" maxlength="500" placeholder="Describe el estado y los detalles del artículo" required></textarea>
                </div>
                <button class="tienda__publicar-boton" type="submit">Publicar artículo</button>
            </form>
        </section>
        <div class="contenedor-tienda"></div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
